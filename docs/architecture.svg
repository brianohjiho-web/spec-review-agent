    <rect x="700" y="150" width="140" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="770" y="186" font-weight="700">Engineer</text>
    <text x="770" y="208" font-size="12">Makes the call</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M140 190 H173"/>
    <path d="M315 190 H348"/>
    <path d="M490 190 H523"/>
    <path d="M665 190 H698"/>
  </g>
  <text x="430" y="32" font-size="19" font-weight="700" text-anchor="middle" fill="#0f172a">How SpecCheck AI works</text>
