<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <g font-size="15" text-anchor="middle" fill="#0f172a">
    <rect x="20" y="150" width="120" height="80" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="80" y="186" font-weight="700">Spec PDF</text>
    <text x="80" y="208" font-size="12">Text is pulled out</text>

    <rect x="175" y="140" width="140" height="100" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="245" y="180" font-weight="700">Claude agent</text>
    <text x="245" y="202" font-size="12">Reads the spec</text>
    <text x="245" y="220" font-size="12">Calls the tools</text>

    <rect x="350" y="150" width="140" height="80" rx="8" fill="#f1f5f9" stroke="#64748b"/>
